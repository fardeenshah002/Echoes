<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHOES - Next-Gen Audio Streaming Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f3ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            900: '#0f172a',
                            dark: '#090d16'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.4);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
    </style>
</head>
<body class="bg-[#070a10] text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Top Navbar -->
    <header class="sticky top-0 z-40 glass border-b border-slate-800/80 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid to-wave-square text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wider bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">ECHOES</h1>
                <p class="text-[10px] text-indigo-400 tracking-widest uppercase">Next-Gen Audio</p>
            </div>
        </div>

        <div class="relative max-w-md w-full mx-4">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Search songs, artists, albums..." class="w-full bg-slate-900/90 border border-slate-700/60 rounded-full py-2.5 pl-11 pr-4 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
        </div>

        <div class="flex items-center gap-4">
            <span class="text-xs px-3 py-1.5 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 font-medium hidden sm:inline-block">
                <i class="fa-solid fa-sparkles mr-1.5"></i>Pro Audio Engine
            </span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 mb-28">
        
        <!-- Left 2 Columns: Search & Results -->
        <section class="lg:col-span-2 space-y-6">
            <div class="glass-panel p-6 rounded-2xl">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-slate-100 flex items-center gap-2">
                        <i class="fa-solid fa-fire text-indigo-400"></i> Discover Tracks
                    </h2>
                    <span id="resultsCount" class="text-xs text-slate-400">Showing top results</span>
                </div>

                <div id="songsList" class="space-y-2">
                    <!-- Dynamic Songs Inject Here -->
                    <div class="text-center py-12 text-slate-400 text-sm">
                        <i class="fa-solid fa-spinner fa-spin text-2xl text-indigo-500 mb-3 block"></i>
                        Loading trending tracks...
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Column: Visualizer & Controls -->
        <section class="space-y-6">
            <!-- Spectrum Visualizer -->
            <div class="glass-panel p-6 rounded-2xl flex flex-col items-center">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 w-full flex items-center justify-between">
                    <span>Audio Spectrum</span>
                    <i class="fa-solid fa-chart-simple text-indigo-400"></i>
                </h3>
                <canvas id="visualizer" class="w-full h-36 rounded-xl bg-slate-950/80 border border-slate-800/80"></canvas>
            </div>

            <!-- Quick Information -->
            <div class="glass-panel p-6 rounded-2xl space-y-3">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center justify-between">
                    <span>Now Playing Info</span>
                    <i class="fa-solid fa-circle-info text-indigo-400"></i>
                </h3>
                <div class="flex items-center gap-4 pt-2">
                    <img id="nowPlayingArt" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150" class="w-16 h-16 rounded-lg object-cover border border-slate-700 shadow-md">
                    <div class="overflow-hidden">
                        <p id="nowPlayingTitle" class="font-semibold text-sm text-slate-100 truncate">Select a song</p>
                        <p id="nowPlayingArtist" class="text-xs text-slate-400 truncate">ECHOES Platform</p>
                        <p id="nowPlayingAlbum" class="text-[11px] text-indigo-400/80 truncate mt-1">Global Music Stream</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Player Dock -->
    <footer class="fixed bottom-0 left-0 right-0 glass border-t border-slate-800/80 px-6 py-3 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <!-- Currently Playing Thumb -->
            <div class="flex items-center gap-3 w-1/4">
                <img id="dockArt" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" class="w-12 h-12 rounded-lg object-cover border border-slate-700">
                <div class="truncate">
                    <p id="dockTitle" class="text-sm font-medium text-slate-100 truncate">Ready to play</p>
                    <p id="dockArtist" class="text-xs text-slate-400 truncate">Search or click play</p>
                </div>
            </div>

            <!-- Center Controls -->
            <div class="flex flex-col items-center gap-1.5 w-2/4 max-w-md">
                <div class="flex items-center gap-6">
                    <button id="prevBtn" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-backward-step text-lg"></i></button>
                    <button id="playBtn" class="w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg shadow-indigo-600/40 transition">
                        <i class="fa-solid fa-play text-sm ml-0.5" id="playIcon"></i>
                    </button>
                    <button id="nextBtn" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-forward-step text-lg"></i></button>
                </div>
                <div class="w-full flex items-center gap-2 text-xs text-slate-400">
                    <span id="currentTime">0:00</span>
                    <input type="range" id="progressBar" min="0" max="100" value="0" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    <span id="duration">0:00</span>
                </div>
            </div>

            <!-- Right Volume -->
            <div class="flex items-center justify-end gap-3 w-1/4">
                <i class="fa-solid fa-volume-high text-slate-400 text-sm"></i>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" class="w-20 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>
        </div>
    </footer>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const searchInput = document.getElementById('searchInput');
        const songsList = document.getElementById('songsList');

        let currentTracks = [];
        let currentIndex = 0;

        // Fetch Songs from iTunes Search API
        async function fetchSongs(query = 'Arijit Singh') {
            songsList.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-indigo-500 mb-3 block"></i>Searching tracks...
            </div>`;
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=15`);
                const data = await res.json();
                currentTracks = data.results.filter(item => item.previewUrl);
                renderSongs(currentTracks);
            } catch (err) {
                songsList.innerHTML = `<p class="text-red-400 text-center py-8">Failed to fetch songs. Try another search.</p>`;
            }
        }

        function renderSongs(tracks) {
            if (!tracks.length) {
                songsList.innerHTML = `<p class="text-slate-400 text-center py-8">No tracks found.</p>`;
                return;
            }
            songsList.innerHTML = tracks.map((track, idx) => `
                <div onclick="playTrack(${idx})" class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-800/60 cursor-pointer transition group border border-transparent hover:border-slate-700/50">
                    <div class="flex items-center gap-3">
                        <img src="${track.artworkUrl100}" class="w-11 h-11 rounded-lg object-cover">
                        <div>
                            <p class="text-sm font-medium text-slate-100 group-hover:text-indigo-400 transition truncate max-w-xs">${track.trackName}</p>
                            <p class="text-xs text-slate-400 truncate max-w-xs">${track.artistName}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-xs text-slate-500">${track.primaryGenreName || 'Music'}</span>
                        <button class="w-8 h-8 rounded-full bg-slate-800 group-hover:bg-indigo-600 text-slate-300 group-hover:text-white flex items-center justify-center transition">
                            <i class="fa-solid fa-play text-xs ml-0.5"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function playTrack(index) {
            currentIndex = index;
            const track = currentTracks[index];
            if (!track) return;

            audio.src = track.previewUrl;
            audio.play();

            document.getElementById('nowPlayingArt').src = track.artworkUrl100;
            document.getElementById('nowPlayingTitle').innerText = track.trackName;
            document.getElementById('nowPlayingArtist').innerText = track.artistName;
            document.getElementById('nowPlayingAlbum').innerText = track.collectionName || 'Single';

            document.getElementById('dockArt').src = track.artworkUrl100;
            document.getElementById('dockTitle').innerText = track.trackName;
            document.getElementById('dockArtist').innerText = track.artistName;

            playIcon.className = 'fa-solid fa-pause text-sm';
        }

        playBtn.addEventListener('click', () => {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                playIcon.className = 'fa-solid fa-pause text-sm';
            } else {
                audio.pause();
                playIcon.className = 'fa-solid fa-play text-sm ml-0.5';
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationEl.innerText = formatTime(audio.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim()) {
                fetchSongs(searchInput.value.trim());
            }
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) playTrack(currentIndex - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < currentTracks.length - 1) playTrack(currentIndex + 1);
        });

        // Simple Visualizer Animation
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        function drawVisualizer() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const bars = 25;
            const barWidth = canvas.width / bars;
            for (let i = 0; i < bars; i++) {
                const barHeight = audio.paused ? 5 : Math.random() * (canvas.height - 10) + 5;
                ctx.fillStyle = '#6366f1';
                ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 2, barHeight);
            }
            requestAnimationFrame(drawVisualizer);
        }
        drawVisualizer();

        // Initial fetch
        fetchSongs('The Weeknd');
    </script>
</body>
</html>
